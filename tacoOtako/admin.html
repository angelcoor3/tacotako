<!-- admin.html -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin | TacoO'TAKOS</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
<div class="wrap nav">
<div class="brand">
<img src="logo.png" alt="Logo">
<span>TacoO'TAKOS</span>
</div>

<nav>
<a href="index.html">Inicio</a>
<a href="menu.html">Menú</a>
</nav>
</div>
</header>

<section class="page">
<div class="wrap admin-wrap">

<!-- LOGIN -->
<div id="loginBox" class="panel">
<h1>Panel Admin</h1>
<p>Acceso privado</p>

<input type="password" id="pass" placeholder="Contraseña">
<button class="btn gold w100" onclick="login()">Entrar</button>
</div>

<!-- PANEL -->
<div id="panelBox" class="hide">

<div class="panel">
<h2>Estado del negocio</h2>

<select id="estadoSelect">
<option value="ABIERTO">ABIERTO</option>
<option value="CERRADO">CERRADO</option>
</select>
</div>

<div id="adminProductos"></div>

<button class="btn green w100 mt" onclick="guardarTodo()">
Guardar Cambios
</button>

</div>

</div>
</section>

<script src="app.js"></script>
</body>
</html>
