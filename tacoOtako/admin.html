<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | TacoO'TAKOS</title>
<meta name="theme-color" content="#111111">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark fixed-top nav-pro">
<div class="container-fluid px-3">

<a href="index.html" class="navbar-brand fw-bold m-0 brand-logo">
🌮 TacoO'TAKOS
</a>

<a href="menu.html" class="btn btn-sm btn-warning fw-bold px-3">
Menú
</a>

</div>
</nav>

<section class="page-wrap">

<div class="container">

<!-- LOGIN -->
<div id="loginBox" class="admin-card">

<h1 class="main-title-sm text-center mb-4">
Panel Admin
</h1>

<input 
type="password" 
id="pass" 
class="form-control admin-input mb-3" 
placeholder="Contraseña">

<button class="btn btn-danger w-100 py-3 fw-bold" onclick="loginAdmin()">
Entrar
</button>

</div>

<!-- PANEL -->
<div id="panelBox" class="d-none">

<!-- Estado -->
<div class="admin-card mb-4">

<h2 class="section-title">Estado del Negocio</h2>

<select id="estadoSelect" class="form-select admin-input">
<option value="ABIERTO">ABIERTO</option>
<option value="CERRADO">CERRADO</option>
</select>

</div>

<!-- Productos -->
<div id="adminProductos">

<!-- JS -->

</div>

<!-- Guardar -->
<button class="btn btn-success w-100 py-3 fw-bold mt-3" onclick="guardarCambios()">
Guardar Cambios
</button>

</div>

</div>

</section>

<script src="app.js"></script>

</body>
</html>
