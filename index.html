<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TacosO'TAKOS</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f0f0f;
  color: white;
}

/* NAV */
nav {
  background: #111;
  padding: 15px;
  text-align: center;
  position: sticky;
  top: 0;
}

button {
  margin: 5px;
  padding: 10px 20px;
  border: none;
  background: #00ffcc;
  color: black;
  font-weight: bold;
  cursor: pointer;
  border-radius: 8px;
  transition: 0.3s;
}

button:hover {
  background: #00ccaa;
  transform: scale(1.05);
}

.container {
  padding: 20px;
  text-align: center;
}

#logo {
  width: 220px;
  margin-top: 20px;
}

.estado {
  font-size: 28px;
  margin: 15px 0;
}

/* 🔥 CARRUSEL CENTRADO PERFECTO */
.carousel {
  display: flex;
  overflow-x: auto;
  gap: 15px;
  padding: 20px;
  scroll-snap-type: x mandatory;
}

.carousel::before,
.carousel::after {
  content: "";
  flex: 1;
}

.card {
  flex: 0 0 auto;
  min-width: 200px;
  max-width: 200px;
  background: #1a1a1a;
  border-radius: 12px;
  padding: 10px;
  scroll-snap-align: center;

  opacity: 0;
  transform: translateY(20px);
  transition: 0.4s ease;
}

.card.visible {
  opacity: 1;
  transform: translateY(0);
}

.card:hover {
  transform: scale(1.07);
}

.card img {
  width: 100%;
  border-radius: 10px;
  cursor: pointer;
}

.precio {
  color: #00ffcc;
  font-weight: bold;
}

h3 {
  margin-top: 30px;
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  z-index: 100;
  background: rgba(0,0,0,0.9);
  width: 100%;
  height: 100%;
  top: 0;
}

.modal img {
  max-width: 90%;
  margin: auto;
  display: block;
}

.cerrar {
  position: absolute;
  top: 20px;
  right: 40px;
  font-size: 40px;
  cursor: pointer;
}

/* BOTONES */
.btn-float {
  position: fixed;
  right: 20px;
  width: 55px;
  height: 55px;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 25px;
  color: white;
  text-decoration: none;
}

.whatsapp { bottom: 20px; background: #25D366; }
.telefono { bottom: 90px; background: #007bff; }

.hidden { display: none; }
</style>
</head>

<body>

<nav>
  <button onclick="mostrarInicio()">Inicio</button>
  <button onclick="mostrarMenu()">Menú</button>
</nav>

<!-- INICIO -->
<div id="inicio" class="container">

<img id="logo" src="logo.png">
<h1>TacosO'TAKOS</h1>

<div id="estado" class="estado"></div>

<p>Jueves a Sábado 7:30 PM - 11:00 PM</p>

<div style="margin-top:30px;">
<h2>Ubicación</h2>
<iframe src="https://www.google.com/maps?q=Nogales,Sonora&output=embed"
width="100%" height="300" style="border-radius:10px;"></iframe>
</div>

</div>

<!-- MENU -->
<div id="menu" class="container hidden">

<h2>Menú</h2>

<h3>Tacos</h3>
<div class="carousel">
  <div class="card"><img src="imagen.png" onclick="abrirModal(this.src,'Taco Carnitas','Carne jugosa','$25')"><p>Carnitas</p><p class="precio">$25</p></div>
  <div class="card"><img src="imagen.png" onclick="abrirModal(this.src,'Taco Buche','Carne suave','$25')"><p>Buche</p><p class="precio">$25</p></div>
  <div class="card"><img src="imagen.png" onclick="abrirModal(this.src,'Taco Cuero','Crujiente','$25')"><p>Cuero</p><p class="precio">$25</p></div>
  <div class="card"><img src="imagen.png" onclick="abrirModal(this.src,'Taco Tripa','Doradita','$25')"><p>Tripa</p><p class="precio">$25</p></div>
</div>

<h3>Tortas</h3>
<div class="carousel">
  <div class="card"><img src="imagen.png" onclick="abrirModal(this.src,'Torta Carnitas','Pan con carne','$60')"><p>Carnitas</p><p class="precio">$60</p></div>
  <div class="card"><img src="imagen.png" onclick="abrirModal(this.src,'Torta Buche','Deliciosa','$60')"><p>Buche</p><p class="precio">$60</p></div>
</div>

<h3>Gringas</h3>
<div class="carousel">
  <div class="card"><img src="imagen.png" onclick="abrirModal(this.src,'Gringa Chica','Con queso','$40')"><p>Chica</p><p class="precio">$40</p></div>
  <div class="card"><img src="imagen.png" onclick="abrirModal(this.src,'Gringa Grande','Más carne','$70')"><p>Grande</p><p class="precio">$70</p></div>
</div>

<h3>Promoción</h3>
<div class="carousel">
  <div class="card"><img src="imagen.png" onclick="abrirModal(this.src,'Promo Pastor','10 tacos','$100')"><p>10 x $100</p></div>
</div>

</div>

<!-- MODAL -->
<div id="modal" class="modal" onclick="cerrarModal()">
  <span class="cerrar">&times;</span>
  <div onclick="event.stopPropagation()" style="text-align:center; padding-top:40px;">
    <img id="modal-img">
    <h2 id="modal-title"></h2>
    <p id="modal-desc"></p>
    <p id="modal-price" class="precio"></p>
  </div>
</div>

<a href="tel:6311234567" class="btn-float telefono">📞</a>
<a href="https://wa.me/526311234567" class="btn-float whatsapp">💬</a>

<script>
function mostrarMenu(){
  document.getElementById("inicio").classList.add("hidden");
  document.getElementById("menu").classList.remove("hidden");
  animarCards();
}

function mostrarInicio(){
  document.getElementById("menu").classList.add("hidden");
  document.getElementById("inicio").classList.remove("hidden");
}

function abrirModal(img,titulo,desc,precio){
  document.getElementById("modal").style.display="block";
  document.getElementById("modal-img").src=img;
  document.getElementById("modal-title").innerText=titulo;
  document.getElementById("modal-desc").innerText=desc;
  document.getElementById("modal-price").innerText=precio;
}

function cerrarModal(){
  document.getElementById("modal").style.display="none";
}

function actualizarEstado(){
  const ahora=new Date();
  const dia=ahora.getDay();
  const minutos=ahora.getHours()*60+ahora.getMinutes();
  const apertura=19*60+30;
  const cierre=23*60;
  const dias=[4,5,6];

  const estado=document.getElementById("estado");

  if(dias.includes(dia)&&minutos>=apertura&&minutos<cierre){
    estado.innerHTML="🟢 ABIERTO";
    estado.style.color="#00ff88";
  }else{
    estado.innerHTML="🔴 CERRADO";
    estado.style.color="#ff4444";
  }
}

function animarCards(){
  document.querySelectorAll(".card").forEach((c,i)=>{
    setTimeout(()=>c.classList.add("visible"),i*100);
  });
}

actualizarEstado();
</script>

</body>
</html>
