<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TacosO'TAKOS</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f0f0f;
  color: white;
}

/* NAV */
nav {
  background: #111;
  padding: 15px;
  text-align: center;
  position: sticky;
  top: 0;
}

button {
  margin: 5px;
  padding: 10px 20px;
  border: none;
  background: #00ffcc;
  color: black;
  font-weight: bold;
  cursor: pointer;
  border-radius: 8px;
  transition: 0.3s;
}

button:hover {
  background: #00ccaa;
  transform: scale(1.05);
}

/* LOGO */
#logo {
  width: 220px;
  margin-top: 20px;
}

/* ESTADO */
.estado {
  font-size: 28px;
  margin: 15px 0;
}

/* CONTENEDOR */
.container {
  padding: 20px;
  text-align: center;
}

/* CARRUSEL */
.carousel {
  display: flex;
  overflow-x: auto;
  gap: 15px;
  padding: 10px;
  scroll-snap-type: x mandatory;
}

.card {
  min-width: 200px;
  background: #1a1a1a;
  border-radius: 12px;
  padding: 10px;
  transition: 0.3s;
  scroll-snap-align: start;
}

.card:hover {
  transform: scale(1.05);
}

.card img {
  width: 100%;
  border-radius: 10px;
  cursor: pointer;
}

.card p {
  margin-top: 8px;
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  z-index: 100;
  background: rgba(0,0,0,0.9);
  width: 100%;
  height: 100%;
  top: 0;
  left: 0;
}

.modal img {
  display: block;
  margin: 5% auto;
  max-width: 90%;
}

.cerrar {
  position: absolute;
  top: 20px;
  right: 40px;
  font-size: 40px;
  cursor: pointer;
}

/* ANIMACIONES */
.fade {
  animation: fadeIn 0.5s ease;
}

@keyframes fadeIn {
  from {opacity: 0;}
  to {opacity: 1;}
}

/* OCULTO */
.hidden {
  display: none;
}
</style>

</head>
<body>

<nav>
  <button onclick="mostrarInicio()">Inicio</button>
  <button onclick="mostrarMenu()">Menú</button>
</nav>

<!-- INICIO -->
<div id="inicio" class="container fade">

<img id="logo" src="logo.png">

<h1>TacosO'TAKOS</h1>

<div id="estado" class="estado"></div>

<p>Jueves a Sábado 7:30 PM - 11:00 PM</p>

</div>

<!-- MENU -->
<div id="menu" class="container hidden">

<h2>Menú</h2>

<h3>Tacos</h3>
<div class="carousel">
  <div class="card">
    <img src="https://via.placeholder.com/300" onclick="abrirModal(this.src)">
    <p>Carnitas</p>
  </div>
  <div class="card">
    <img src="https://via.placeholder.com/300" onclick="abrirModal(this.src)">
    <p>Buche</p>
  </div>
  <div class="card">
    <img src="https://via.placeholder.com/300" onclick="abrirModal(this.src)">
    <p>Cuero</p>
  </div>
  <div class="card">
    <img src="https://via.placeholder.com/300" onclick="abrirModal(this.src)">
    <p>Tripa</p>
  </div>
</div>

<h3>Tortas</h3>
<div class="carousel">
  <div class="card">
    <img src="https://via.placeholder.com/300" onclick="abrirModal(this.src)">
    <p>Carnitas</p>
  </div>
  <div class="card">
    <img src="https://via.placeholder.com/300" onclick="abrirModal(this.src)">
    <p>Buche</p>
  </div>
</div>

<h3>Gringas</h3>
<div class="carousel">
  <div class="card">
    <img src="https://via.placeholder.com/300" onclick="abrirModal(this.src)">
    <p>Chica</p>
  </div>
  <div class="card">
    <img src="https://via.placeholder.com/300" onclick="abrirModal(this.src)">
    <p>Grande</p>
  </div>
</div>

<h3>Promoción</h3>
<div class="carousel">
  <div class="card">
    <img src="https://via.placeholder.com/300" onclick="abrirModal(this.src)">
    <p>10 x $100 Pastor</p>
  </div>
</div>

</div>

<!-- MODAL -->
<div id="modal" class="modal" onclick="cerrarModal()">
  <span class="cerrar">&times;</span>
  <img id="modal-img">
</div>

<script>

// navegación
function mostrarMenu() {
  document.getElementById("inicio").classList.add("hidden");
  document.getElementById("menu").classList.remove("hidden");
}

function mostrarInicio() {
  document.getElementById("menu").classList.add("hidden");
  document.getElementById("inicio").classList.remove("hidden");
}

// modal
function abrirModal(src) {
  document.getElementById("modal").style.display = "block";
  document.getElementById("modal-img").src = src;
}

function cerrarModal() {
  document.getElementById("modal").style.display = "none";
}

// estado automático
function actualizarEstado() {

  const ahora = new Date();
  const dia = ahora.getDay();

  const minutos = ahora.getHours() * 60 + ahora.getMinutes();

  const apertura = 19 * 60 + 30;
  const cierre = 23 * 60;

  const dias = [4,5,6]; // jueves viernes sábado

  const estadoEl = document.getElementById("estado");

  if (dias.includes(dia) && minutos >= apertura && minutos < cierre) {
    estadoEl.innerHTML = "🟢 ABIERTO";
    estadoEl.style.color = "#00ff88";
  } else {
    estadoEl.innerHTML = "🔴 CERRADO";
    estadoEl.style.color = "#ff4444";
  }
}

actualizarEstado();

</script>

</body>
</html>
